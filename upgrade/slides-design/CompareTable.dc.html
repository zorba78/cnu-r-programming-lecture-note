<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#FAF7F2; color:#241F1A;
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      -webkit-font-smoothing:antialiased; text-wrap:pretty; }
    a { color:#A64B32; text-decoration:none; }
    a:hover { color:#7E3624; }
    .mono { font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,'Malgun Gothic',monospace; }
    .disp { font-family:'Hahmlet','Nanum Myeongjo','Apple SD Gothic Neo',serif; }
    table { border-collapse:collapse; width:100%; }
    th, td { padding:15px 12px; text-align:right; font-size:22px; }
    th { font-family:'Hahmlet',serif; font-weight:700; font-size:23px;
      border-bottom:2px solid #241F1A; color:#241F1A; }
    td { font-family:'IBM Plex Mono',monospace; border-bottom:1px solid #E4DCD0; color:#5C554C; }
    tr td:first-child, tr th:first-child { text-align:left; }
    .hot { color:#A64B32; font-weight:500; }
    .cool { color:#1F6F7A; font-weight:500; }
  </style>
</helmet>

<div style="width:1280px; height:720px; background:#FAF7F2; display:flex; flex-direction:column; padding:52px 80px 40px;">

  <div style="display:flex; justify-content:space-between; align-items:baseline; padding-bottom:13px; border-bottom:2px solid #241F1A;">
    <div style="display:flex; align-items:baseline; gap:18px;">
      <span class="mono" style="font-size:14px; letter-spacing:0.18em; color:#A64B32;">1.3</span>
      <span class="disp" style="font-size:34px; font-weight:700;">차수가 다르면 무엇이 달라지는가</span>
    </div>
    <span class="mono" style="font-size:14px; letter-spacing:0.12em; color:#8C8479;">08 알고리즘</span>
  </div>

  <div style="padding-top:30px; flex-grow:1; display:flex; flex-direction:column; gap:24px;">

    <table>
      <thead>
        <tr>
          <th style="width:130px;">n</th>
          <th>𝒪(1)</th>
          <th>𝒪(log n)</th>
          <th>𝒪(n)</th>
          <th>𝒪(n log n)</th>
          <th>𝒪(n²)</th>
          <th>𝒪(2ⁿ)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="color:#241F1A; font-weight:500;">10</td>
          <td class="cool">1</td><td class="cool">3</td><td>10</td><td>33</td>
          <td class="hot">100</td><td class="hot">1,024</td>
        </tr>
        <tr style="background:#F3EEE5;">
          <td style="color:#241F1A; font-weight:500;">100</td>
          <td class="cool">1</td><td class="cool">7</td><td>100</td><td>664</td>
          <td class="hot">10,000</td><td class="hot">1.3e+30</td>
        </tr>
        <tr>
          <td style="color:#241F1A; font-weight:500;">1,000</td>
          <td class="cool">1</td><td class="cool">10</td><td>1,000</td><td>9,966</td>
          <td class="hot">1,000,000</td><td class="hot">1.1e+301</td>
        </tr>
      </tbody>
    </table>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:auto;">
      <div style="display:flex; flex-direction:column; gap:9px; padding:22px 26px; background:#FFFFFF; border:1px solid #E4DCD0; border-left:5px solid #1F6F7A;">
        <span class="mono" style="font-size:13px; letter-spacing:0.14em; color:#1F6F7A;">n = 1,000</span>
        <span style="font-size:22px; line-height:1.55; color:#241F1A;">
          𝒪(n) 과 𝒪(n²) 의 연산 횟수는 <b>천 배</b> 차이가 난다.
        </span>
      </div>
      <div style="display:flex; flex-direction:column; gap:9px; padding:22px 26px; background:#FFFFFF; border:1px solid #E4DCD0; border-left:5px solid #A64B32;">
        <span class="mono" style="font-size:13px; letter-spacing:0.14em; color:#A64B32;">결론</span>
        <span style="font-size:22px; line-height:1.55; color:#241F1A;">
          <b>차수가 다르면 하드웨어 성능 향상으로 해결할 수 있는 문제가 아니다.</b>
        </span>
      </div>
    </div>

  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; padding-top:14px; border-top:1px solid #E4DCD0;">
    <span class="mono" style="font-size:13px; color:#B5A996;">통계 프로그래밍 언어 · 08 알고리즘</span>
    <span class="mono" style="font-size:13px; color:#8C8479;">14</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
