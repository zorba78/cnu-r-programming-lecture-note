<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#1F6F7A; color:#F4FAFA;
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      -webkit-font-smoothing:antialiased; text-wrap:pretty; }
    a { color:#FAF7F2; text-decoration:none; }
    a:hover { color:#CFE6E9; }
    .mono { font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,'Malgun Gothic',monospace; }
    .disp { font-family:'Hahmlet','Nanum Myeongjo','Apple SD Gothic Neo',serif; }
    .opt { display:flex; align-items:center; gap:18px; padding:19px 26px;
      background:rgba(250,247,242,0.10); border:1px solid rgba(250,247,242,0.28); }
    .optkey { font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:500;
      width:38px; height:38px; display:flex; align-items:center; justify-content:center;
      background:#FAF7F2; color:#1F6F7A; flex-shrink:0; }
  </style>
</helmet>

<div style="box-sizing:border-box; width:1280px; height:720px; background:#1F6F7A; display:flex; flex-direction:column; padding:52px 80px 40px; position:relative; overflow:hidden;">

  <div class="disp" style="position:absolute; left:-30px; top:-60px; font-size:260px; line-height:1; color:#FAF7F2; opacity:0.07; pointer-events:none;">?</div>

  <div style="display:flex; justify-content:space-between; align-items:baseline; padding-bottom:13px; border-bottom:2px solid rgba(250,247,242,0.5); position:relative;">
    <span class="mono" style="font-size:15px; letter-spacing:0.2em; color:#FAF7F2;">PREDICT · 예측해 보자</span>
    <span class="mono" style="font-size:14px; letter-spacing:0.12em; color:rgba(250,247,242,0.6);">실행 전에 답을 적는다</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:36px; padding-top:44px; flex-grow:1; position:relative;">

    <h2 class="disp" style="margin:0; font-size:52px; line-height:1.34; font-weight:700; letter-spacing:-0.015em; max-width:1000px;">
      <span class="mono" style="font-size:44px; font-weight:500;">n</span> 이 5만일 때 두 프로그램의<br>실행 시간은 얼마나 차이 나겠는가?
    </h2>

    <div style="display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:18px; max-width:1000px;">
      <div class="opt"><span class="optkey">A</span><span style="font-size:21px;">비슷한 수준</span></div>
      <div class="opt"><span class="optkey">B</span><span style="font-size:21px;">두 배 정도</span></div>
      <div class="opt"><span class="optkey">C</span><span style="font-size:21px;">그보다 크다</span></div>
    </div>

    <div style="display:flex; align-items:center; gap:16px; margin-top:auto; padding:18px 26px; background:rgba(36,31,26,0.22); border-left:4px solid #FAF7F2; max-width:1000px;">
      <span class="mono" style="font-size:14px; letter-spacing:0.14em; color:rgba(250,247,242,0.75); white-space:nowrap;">왜</span>
      <span style="font-size:20px; line-height:1.6; color:#F4FAFA;">
        틀린 예측이 학습의 출발점이다. 답을 적어 두어야 실행 결과와 대조할 것이 생긴다.
      </span>
    </div>

  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; padding-top:14px; border-top:1px solid rgba(250,247,242,0.25); position:relative;">
    <span class="mono" style="font-size:13px; color:rgba(250,247,242,0.55);">통계 프로그래밍 언어 · 08 알고리즘</span>
    <span class="mono" style="font-size:13px; color:rgba(250,247,242,0.8);">6</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
