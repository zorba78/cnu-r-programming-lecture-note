<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#F3EEE5; color:#241F1A;
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      -webkit-font-smoothing:antialiased; text-wrap:pretty; }
    a { color:#A64B32; text-decoration:none; }
    a:hover { color:#7E3624; }
    .mono { font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,'Malgun Gothic',monospace; }
    .disp { font-family:'Hahmlet','Nanum Myeongjo','Apple SD Gothic Neo',serif; }
    .step { display:flex; align-items:baseline; gap:16px; padding:12px 0; }
  </style>
</helmet>

<div style="width:1280px; height:720px; background:#F3EEE5; display:grid; grid-template-columns:1.15fr 1fr; gap:70px; padding:72px 80px; align-items:center;">

  <div style="display:flex; flex-direction:column; gap:26px;">
    <div style="display:flex; align-items:baseline; gap:20px;">
      <span class="disp" style="font-size:96px; line-height:1; font-weight:700; color:#A64B32;">3</span>
      <span class="mono" style="font-size:15px; letter-spacing:0.2em; color:#8C8479;">SECTION</span>
    </div>
    <h2 class="disp" style="margin:0; font-size:60px; line-height:1.16; font-weight:700; letter-spacing:-0.02em;">탐색 알고리즘</h2>
    <p style="margin:0; max-width:520px; font-size:22px; line-height:1.7; color:#5C554C;">
      복잡도의 차수가 다르다는 사실이 실제로 어떤 차이를 만드는지 수치로 확인한다.
    </p>
  </div>

  <div style="display:flex; flex-direction:column; gap:6px; padding-left:44px; border-left:1px solid #D5CABB;">
    <span class="mono" style="font-size:13px; letter-spacing:0.16em; color:#6E665C; padding-bottom:10px;">이 절에서</span>
    <div class="step">
      <span class="mono" style="font-size:15px; color:#A64B32; width:34px;">3.1</span>
      <span style="font-size:22px;">선형 탐색</span>
    </div>
    <div class="step">
      <span class="mono" style="font-size:15px; color:#A64B32; width:34px;">3.2</span>
      <span style="font-size:22px;">이진 탐색</span>
    </div>
    <div class="step" style="background:#EAE0D1; margin:0 -14px; padding:12px 14px;">
      <span class="mono" style="font-size:15px; color:#A64B32; width:34px;">3.3</span>
      <span style="font-size:22px; font-weight:600;">구현의 정확성 검증</span>
    </div>
    <div class="step">
      <span class="mono" style="font-size:15px; color:#A64B32; width:34px;">3.4</span>
      <span style="font-size:22px;">두 탐색의 비용 비교</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
