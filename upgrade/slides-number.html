<script>
// 쪽번호를 슬라이드 안(꼬리말 오른쪽)에 그리기 위해 각 슬라이드에 data-no 를 붙인다.
// revealjs 기본 쪽번호(.slide-number)는 화면 좌표에 떠 있어서, 슬라이드 비율과 창 비율이
// 다르면 원안의 꼬리말 선과 어긋난다. 그래서 slide-number: false 로 두고 여기서 매긴다.
window.addEventListener('load', function () {
  function stamp() {
    var s = Reveal.getSlides(), t = s.length;
    s.forEach(function (el, i) { el.setAttribute('data-no', (i + 1) + ' / ' + t); });
  }
  if (Reveal.isReady()) stamp(); else Reveal.on('ready', stamp);
});
</script>
